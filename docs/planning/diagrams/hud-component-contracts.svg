<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Breathing HUD redesign component contracts</title>
  <desc id="desc">Contract map connecting semantic status, presentation controls, onboarding, runtime state, editor draft, and Electron ownership.</desc>
  <style>
    .bg{fill:#0b0e13}.box{fill:#141d28;stroke:#4c6175;stroke-width:1.2}.core{fill:#19313a;stroke:#78d9ad;stroke-width:1.5}.side{fill:#30271d;stroke:#f0b56d;stroke-width:1.2}.text{fill:#f5f7fa;font:600 15px system-ui,sans-serif}.muted{fill:#9ba9b9;font:400 11px system-ui,sans-serif}.label{fill:#78d9ad;font:700 10px system-ui,sans-serif;letter-spacing:1.2px}.arrow{stroke:#8095a8;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.tiny{fill:#b7c4d1;font:500 10px system-ui,sans-serif}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8095a8"/></marker></defs>
  <rect class="bg" width="1400" height="760" rx="24"/><text class="label" x="38" y="40">BREATHING HUD / COMPONENT CONTRACTS</text><text class="muted" x="38" y="62">The redesign adds one onboarding component and one disclosure boundary; it does not add a second renderer.</text>

  <rect class="box" x="44" y="112" width="240" height="220" rx="14"/><text class="label" x="66" y="142">PRESENTATION INPUTS</text><text class="text" x="66" y="178">ModeControl</text><text class="muted" x="66" y="201">Zen / Basic / Advanced</text><text class="text" x="66" y="234">UtilityRail</text><text class="muted" x="66" y="257">Edit · Theme · Pin · Hide</text><text class="text" x="66" y="290">TuneDisclosure</text><text class="muted" x="66" y="313">bounded sliders only</text>
  <rect class="box" x="44" y="392" width="240" height="190" rx="14"/><text class="label" x="66" y="422">ONBOARDING</text><text class="text" x="66" y="458">WelcomeTile</text><text class="muted" x="66" y="481">versioned local preference</text><text class="muted" x="66" y="504">onAdvance / onDismiss</text><text class="muted" x="66" y="538">must not start engine</text>

  <rect class="core" x="382" y="164" width="270" height="280" rx="14"/><text class="label" x="408" y="194">SEMANTIC SOURCE</text><text class="text" x="408" y="232">BreathingStatusView</text><text class="muted" x="408" y="258">phase + instruction</text><text class="muted" x="408" y="280">nostril / airway</text><text class="muted" x="408" y="302">phase progress</text><text class="muted" x="408" y="324">state: loading · ready</text><text class="muted" x="408" y="346">empty · error · disabled</text><text class="tiny" x="408" y="396">persistent DOM meaning</text><text class="tiny" x="408" y="414">bounded live announcements</text>

  <rect class="box" x="738" y="104" width="270" height="190" rx="14"/><text class="label" x="764" y="134">RUNTIME OWNER</text><text class="text" x="764" y="172">TileControlSystem</text><text class="muted" x="764" y="198">mode presentation</text><text class="muted" x="764" y="220">sequence + pattern</text><text class="muted" x="764" y="242">pin / resize / notifications</text><text class="muted" x="764" y="264">editor-open intent</text>
  <rect class="box" x="738" y="348" width="270" height="190" rx="14"/><text class="label" x="764" y="378">CANVAS OWNER</text><text class="text" x="764" y="416">EnhancedBreathingEngine</text><text class="muted" x="764" y="442">timing + shape rendering</text><text class="muted" x="764" y="464">arrow cues + reduced motion</text><text class="muted" x="764" y="486">reads status contract</text>

  <rect class="side" x="1084" y="104" width="270" height="190" rx="14"/><text class="label" x="1110" y="134">WINDOW / TRAY</text><text class="text" x="1110" y="172">main.ts + preload.ts</text><text class="muted" x="1110" y="198">show / hide / quit</text><text class="muted" x="1110" y="220">pin click-through</text><text class="muted" x="1110" y="242">open editor bridge</text><text class="muted" x="1110" y="264">global shortcuts</text>
  <rect class="side" x="1084" y="348" width="270" height="190" rx="14"/><text class="label" x="1110" y="378">EDITOR OWNER</text><text class="text" x="1110" y="416">SystemEditor</text><text class="muted" x="1110" y="442">EditorDraft snapshot</text><text class="muted" x="1110" y="464">normalize + preview states</text><text class="muted" x="1110" y="486">save / cancel / reset</text>

  <path class="arrow" d="M284 212 H382"/><path class="arrow" d="M284 470 H350 V390 H382"/><path class="arrow" d="M652 250 H738"/><path class="arrow" d="M652 360 H700 V438 H738"/><path class="arrow" d="M1008 198 H1084"/><path class="arrow" d="M1008 442 H1084"/><path class="arrow dash" d="M1084 250 H1040 V416 H1008"/>
  <text class="tiny" x="300" y="201">intent</text><text class="tiny" x="296" y="458">dismiss only</text><text class="tiny" x="666" y="238">render</text><text class="tiny" x="668" y="426">draw</text><text class="tiny" x="1022" y="186">IPC</text><text class="tiny" x="1022" y="430">draft bridge</text><text class="tiny" x="1032" y="270">apply</text>
  <rect class="core" x="382" y="590" width="626" height="90" rx="14"/><text class="label" x="410" y="620">INVARIANTS</text><text class="muted" x="410" y="648">Status text is authoritative · WelcomeTile never owns engine state · Pin is orthogonal to mode · Editor preview never starts a second timer</text><text class="muted" x="410" y="666">All controls preserve 44px targets, keyboard focus, stable layout, and explicit loading/empty/error/disabled/saved feedback.</text>
</svg>
