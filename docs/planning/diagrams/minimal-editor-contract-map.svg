<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Minimal editor contract map</title>
  <desc id="desc">A diagram connecting editor controls to a normalized draft, preview stage, runtime adapter, and local persistence.</desc>
  <style>
    .bg{fill:#0d1016}.box{fill:#151a23;stroke:#506176;stroke-width:1.5}.core{fill:#203b4a;stroke:#a8d5ff;stroke-width:1.5}.text{fill:#f4f6f8;font:600 16px system-ui,sans-serif}.muted{fill:#9aa7b7;font:400 12px system-ui,sans-serif}.label{fill:#78d9ad;font:700 11px system-ui,sans-serif;letter-spacing:1.3px}.arrow{stroke:#71849a;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#71849a"/></marker></defs>
  <rect class="bg" width="1200" height="560" rx="20"/>
  <text class="text" x="44" y="44">Component contracts / one-way data flow</text>
  <text class="muted" x="44" y="68">Components emit intent. One normalizer owns bounds and invariants.</text>
  <rect class="box" x="60" y="130" width="220" height="260" rx="14"/><text class="label" x="84" y="162">INPUTS</text><text class="text" x="84" y="198">FramePicker</text><text class="muted" x="84" y="221">ThemeField</text><text class="muted" x="84" y="244">RangeField × 5</text><text class="muted" x="84" y="267">StateSwitcher</text><text class="muted" x="84" y="290">Shape / pattern nav</text><text class="muted" x="84" y="336">raw user intent</text>
  <rect class="core" x="360" y="130" width="240" height="260" rx="14"/><text class="label" x="386" y="162">SOURCE OF TRUTH</text><text class="text" x="386" y="202">EditorDraft</text><text class="muted" x="386" y="228">normalizeDraft()</text><text class="muted" x="386" y="254">min / max / step</text><text class="muted" x="386" y="280">invariant correction</text><text class="muted" x="386" y="336">validated snapshot</text>
  <rect class="box" x="680" y="110" width="220" height="150" rx="14"/><text class="label" x="704" y="142">READ MODEL</text><text class="text" x="704" y="180">PreviewStage</text><text class="muted" x="704" y="207">shape + pattern</text><text class="muted" x="704" y="230">theme + frame + state</text>
  <rect class="box" x="680" y="310" width="220" height="150" rx="14"/><text class="label" x="704" y="342">SIDE EFFECTS</text><text class="text" x="704" y="380">Runtime adapter</text><text class="muted" x="704" y="407">Canvas + HUD sizing</text><text class="muted" x="704" y="430">Local persistence</text>
  <rect class="box" x="980" y="190" width="160" height="190" rx="14"/><text class="label" x="1004" y="222">LIFECYCLE</text><text class="text" x="1004" y="258">SaveStatus</text><text class="muted" x="1004" y="286">idle</text><text class="muted" x="1004" y="308">saving</text><text class="muted" x="1004" y="330">saved</text><text class="muted" x="1004" y="352">error + retry</text>
  <path class="arrow" d="M280 260 H360"/><path class="arrow" d="M600 210 H680"/><path class="arrow" d="M600 320 H680"/><path class="arrow" d="M900 380 H980"/><path class="arrow dashed" d="M980 250 H900"/>
  <text class="muted" x="296" y="248">emit</text><text class="muted" x="612" y="198">render</text><text class="muted" x="612" y="308">apply</text><text class="muted" x="914" y="368">report</text><text class="muted" x="904" y="238">status</text>
</svg>
