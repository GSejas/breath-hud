<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">Breathing HUD mode and state map</title>
  <desc id="desc">Matrix comparing Zen, Basic, Advanced, Pinned, and Editor across visible content, interaction policy, and ownership.</desc>
  <style>
    .bg{fill:#0b0e13}.head{fill:#192533;stroke:#4c6277}.cell{fill:#121923;stroke:#314052}.focus{fill:#172b31;stroke:#78d9ad}.warn{fill:#30271d;stroke:#f0b56d}.text{fill:#f5f7fa;font:600 14px system-ui,sans-serif}.muted{fill:#9ba9b9;font:400 11px system-ui,sans-serif}.label{fill:#78d9ad;font:700 10px system-ui,sans-serif;letter-spacing:1.2px}.good{fill:#a8d5ff}.line{stroke:#42566b;stroke-width:1}
  </style>
  <rect class="bg" width="1320" height="620" rx="24"/><text class="label" x="34" y="38">BREATHING HUD / MODE MAP</text><text class="muted" x="34" y="60">Mode controls presentation density; pinning and editor are separate ownership boundaries.</text>
  <rect class="head" x="34" y="92" width="190" height="52" rx="8"/><text class="text" x="52" y="123">Surface</text>
  <rect class="head" x="232" y="92" width="190" height="52" rx="8"/><text class="text" x="250" y="123">Zen</text>
  <rect class="head" x="430" y="92" width="190" height="52" rx="8"/><text class="text" x="448" y="123">Basic</text>
  <rect class="head" x="628" y="92" width="190" height="52" rx="8"/><text class="text" x="646" y="123">Advanced</text>
  <rect class="head" x="826" y="92" width="190" height="52" rx="8"/><text class="text" x="844" y="123">Pinned</text>
  <rect class="head" x="1024" y="92" width="262" height="52" rx="8"/><text class="text" x="1042" y="123">Editor</text>

  <g transform="translate(0,154)"><rect class="cell" x="34" y="0" width="190" height="76" rx="8"/><text class="muted" x="52" y="30">Breath cue</text><text class="muted" x="52" y="50">phase / instruction / time</text><rect class="focus" x="232" y="0" width="190" height="76" rx="8"/><text class="good" x="250" y="30">Always visible</text><text class="muted" x="250" y="50">primary surface</text><rect class="focus" x="430" y="0" width="190" height="76" rx="8"/><text class="good" x="448" y="30">Always visible</text><text class="muted" x="448" y="50">primary surface</text><rect class="focus" x="628" y="0" width="190" height="76" rx="8"/><text class="good" x="646" y="30">Always visible</text><text class="muted" x="646" y="50">primary surface</text><rect class="focus" x="826" y="0" width="190" height="76" rx="8"/><text class="good" x="844" y="30">Dimmed, still legible</text><text class="muted" x="844" y="50">click-through state</text><rect class="cell" x="1024" y="0" width="262" height="76" rx="8"/><text class="muted" x="1042" y="30">Deterministic preview</text><text class="muted" x="1042" y="50">not live engine timing</text></g>
  <g transform="translate(0,238)"><rect class="cell" x="34" y="0" width="190" height="76" rx="8"/><text class="muted" x="52" y="30">Utility rail</text><text class="muted" x="52" y="50">Edit / Theme / Pin / Hide</text><rect class="cell" x="232" y="0" width="190" height="76" rx="8"/><text class="muted" x="250" y="30">Hover or focus</text><text class="muted" x="250" y="50">never hover-only on mobile</text><rect class="focus" x="430" y="0" width="190" height="76" rx="8"/><text class="good" x="448" y="30">Visible</text><text class="muted" x="448" y="50">essential actions</text><rect class="focus" x="628" y="0" width="190" height="76" rx="8"/><text class="good" x="646" y="30">Visible + Tune</text><text class="muted" x="646" y="50">explicit disclosure</text><rect class="warn" x="826" y="0" width="190" height="76" rx="8"/><text class="text" x="844" y="30">Hotspot only</text><text class="muted" x="844" y="50">window input policy</text><rect class="cell" x="1024" y="0" width="262" height="76" rx="8"/><text class="muted" x="1042" y="30">Editor toolbar</text><text class="muted" x="1042" y="50">save status + close</text></g>
  <g transform="translate(0,322)"><rect class="cell" x="34" y="0" width="190" height="76" rx="8"/><text class="muted" x="52" y="30">Session context</text><text class="muted" x="52" y="50">pattern / shape / sequence</text><rect class="cell" x="232" y="0" width="190" height="76" rx="8"/><text class="muted" x="250" y="30">Collapsed</text><text class="muted" x="250" y="50">cue-first</text><rect class="focus" x="430" y="0" width="190" height="76" rx="8"/><text class="good" x="448" y="30">One metadata row</text><text class="muted" x="448" y="50">readable, stable</text><rect class="focus" x="628" y="0" width="190" height="76" rx="8"/><text class="good" x="646" y="30">One metadata row</text><text class="muted" x="646" y="50">plus values</text><rect class="cell" x="826" y="0" width="190" height="76" rx="8"/><text class="muted" x="844" y="30">Preserve prior mode</text><text class="muted" x="844" y="50">on unpin</text><rect class="cell" x="1024" y="0" width="262" height="76" rx="8"/><text class="muted" x="1042" y="30">Draft metadata</text><text class="muted" x="1042" y="50">shape / pattern / theme</text></g>
  <g transform="translate(0,406)"><rect class="cell" x="34" y="0" width="190" height="76" rx="8"/><text class="muted" x="52" y="30">Owner</text><text class="muted" x="52" y="50">runtime presentation</text><rect class="cell" x="232" y="0" width="190" height="76" rx="8"/><text class="muted" x="250" y="30">TileControlSystem</text><text class="muted" x="250" y="50">mode boundary</text><rect class="cell" x="430" y="0" width="190" height="76" rx="8"/><text class="muted" x="448" y="30">TileControlSystem</text><text class="muted" x="448" y="50">mode boundary</text><rect class="cell" x="628" y="0" width="190" height="76" rx="8"/><text class="muted" x="646" y="30">TileControlSystem</text><text class="muted" x="646" y="50">bounded runtime controls</text><rect class="warn" x="826" y="0" width="190" height="76" rx="8"/><text class="text" x="844" y="30">main + renderer</text><text class="muted" x="844" y="50">window + input</text><rect class="cell" x="1024" y="0" width="262" height="76" rx="8"/><text class="muted" x="1042" y="30">SystemEditor</text><text class="muted" x="1042" y="50">draft + persistence bridge</text></g>
  <text class="label" x="34" y="548">RULE</text><text class="muted" x="82" y="548">Do not make Pin or Edit additional breathing modes. They are orthogonal actions with distinct owners.</text>
</svg>
