<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Minimal editor preview state board</title>
  <desc id="desc">Five equal preview cards compare loading, empty, error, success, and disabled states with their message, affordance, and control policy.</desc>
  <style>
    .bg{fill:#0d1016}.card{fill:#151a23;stroke:#344050}.stage{fill:#0e131a;stroke:#344050}.text{fill:#f4f6f8;font:600 15px system-ui,sans-serif}.muted{fill:#9aa7b7;font:400 12px system-ui,sans-serif}.tiny{fill:#9aa7b7;font:400 11px system-ui,sans-serif}.good{fill:#78d9ad}.warn{fill:#e3a54f}.bad{fill:#ff9b98}.disabled{fill:#667283}.shape{fill:none;stroke:#a8d5ff;stroke-width:3}.dash{fill:none;stroke:#667283;stroke-width:2;stroke-dasharray:5 5}
  </style>
  <rect class="bg" width="1200" height="430" rx="20"/>
  <text class="text" x="40" y="42">Preview states / one fixed stage, five meanings</text>
  <text class="muted" x="40" y="64">State messaging is additive so the card never changes height.</text>
  <g transform="translate(40,94)">
    <g><rect class="card" width="208" height="270" rx="12"/><text class="text" x="18" y="30">Loading</text><text class="warn" x="162" y="30">01</text><rect class="stage" x="18" y="50" width="172" height="112" rx="8"/><circle class="shape" cx="104" cy="106" r="28"/><path class="shape" d="M104 72 A34 34 0 0 1 137 106"/><text class="muted" x="18" y="194">Preview is hydrating</text><text class="tiny" x="18" y="220">Controls: enabled</text><text class="tiny" x="18" y="242">Message: Loading preview…</text></g>
    <g transform="translate(224)"><rect class="card" width="208" height="270" rx="12"/><text class="text" x="18" y="30">Empty</text><text class="muted" x="168" y="30">02</text><rect class="stage" x="18" y="50" width="172" height="112" rx="8"/><circle class="dash" cx="104" cy="106" r="28"/><text class="muted" x="18" y="194">No active session</text><text class="tiny" x="18" y="220">Controls: available</text><text class="tiny" x="18" y="242">Message: No session selected</text></g>
    <g transform="translate(448)"><rect class="card" width="208" height="270" rx="12"/><text class="text" x="18" y="30">Error</text><text class="bad" x="168" y="30">03</text><rect class="stage" x="18" y="50" width="172" height="112" rx="8"/><rect x="44" y="78" width="120" height="56" rx="8" fill="#2a1c22" stroke="#ff9b98"/><text class="bad" x="62" y="111" font-family="system-ui" font-size="11">Could not load</text><text class="muted" x="18" y="194">Draft is preserved</text><text class="tiny" x="18" y="220">Controls: retry / edit</text><text class="tiny" x="18" y="242">Message: Preview error</text></g>
    <g transform="translate(672)"><rect class="card" width="208" height="270" rx="12"/><text class="text" x="18" y="30">Success</text><text class="good" x="168" y="30">04</text><rect class="stage" x="18" y="50" width="172" height="112" rx="8"/><circle class="shape" cx="104" cy="106" r="28"/><path class="good" d="M86 106 l12 12 24-28" fill="none" stroke="#78d9ad" stroke-width="3"/><text class="muted" x="18" y="194">Ready to breathe</text><text class="tiny" x="18" y="220">Controls: save enabled</text><text class="tiny" x="18" y="242">Message: Changes saved</text></g>
    <g transform="translate(896)"><rect class="card" width="208" height="270" rx="12"/><text class="text" x="18" y="30">Disabled</text><text class="disabled" x="162" y="30">05</text><rect class="stage" x="18" y="50" width="172" height="112" rx="8" opacity=".7"/><circle class="dash" cx="104" cy="106" r="28" opacity=".6"/><text class="muted" x="18" y="194">Preview unavailable</text><text class="tiny" x="18" y="220">Controls: inspect-only</text><text class="tiny" x="18" y="242">Message: Preview disabled</text></g>
  </g>
</svg>
